apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-demo
  namespace: k8s-resource-lab
  labels:
    app: resource-demo
    scenario: guaranteed-qos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-demo
  template:
    metadata:
      labels:
        app: resource-demo
        scenario: guaranteed-qos
    spec:
      containers:
        - name: web-app
          image: k8s-resource-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SCENARIO_NAME
              value: "Scenario 5: Guaranteed QoS (Requests == Limits)"
            - name: QOS_CLASS
              value: "Guaranteed"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: web-app
                  resource: requests.cpu
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: web-app
                  resource: limits.cpu
            - name: MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: web-app
                  resource: requests.memory
            - name: MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: web-app
                  resource: limits.memory
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "250m"      # Exact match with request => Guaranteed QoS
              memory: "256Mi"  # Exact match with request => Guaranteed QoS
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
