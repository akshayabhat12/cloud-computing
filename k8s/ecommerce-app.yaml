apiVersion: v1
kind: Namespace
metadata:
  name: k8s-resource-lab
  labels:
    app: cloudcommerce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-web
  namespace: k8s-resource-lab
  labels:
    app: ecommerce-web
    tier: frontend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
        tier: frontend-api
    spec:
      containers:
        - name: web
          image: k8s-resource-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SCENARIO_NAME
              value: "CloudCommerce Production (Burstable QoS)"
            - name: QOS_CLASS
              value: "Burstable"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: web
                  resource: requests.cpu
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: web
                  resource: limits.cpu
            - name: MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: web
                  resource: requests.memory
            - name: MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: web
                  resource: limits.memory
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-svc
  namespace: k8s-resource-lab
  labels:
    app: ecommerce-web
spec:
  type: NodePort
  selector:
    app: ecommerce-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
